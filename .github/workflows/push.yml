name: Mobile Recharge Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Build and Test Java Application
      - name: Build and Test
        run: mvn clean test

      # Step 4: Package Application
      - name: Package Application
        run: mvn package

      # Step 5: Docker Hub Login
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: karthici071
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 6: Build Docker Image
      - name: Build Docker Image
        run: docker build -t karthici071/mobile-recharge-app:latest .

      # Step 7: Push Docker Image
      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push karthici071/mobile-recharge-app:latest

      # Step 8: Upload JAR Artifact
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-recharge-app-jar
          path: target/*.jar

      # Step 9: Upload JUnit Test Report
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-test-report
          path: target/surefire-reports/*.xml
