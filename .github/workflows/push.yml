name: Mobile Recharge Docker CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test
        run: mvn clean test

      - name: Package Java Application
        run: mvn package -DskipTests

      - name: Verify JAR
        run: ls -lh target/*.jar

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: karthici071
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t karthici071/mobile-recharge-app:latest .

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: docker push karthici071/mobile-recharge-app:latest

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-recharge-app-jar
          path: target/*.jar

      - name: Upload JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-report
          path: target/surefire-reports/*.xml
